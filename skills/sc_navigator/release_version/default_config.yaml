module: skills.sc_navigator.main
name: SC_Navigator
display_name: Star Citizen Navigator
author: Mallachi
tags:
  - Star Citizen
  - Navigation
  - Route Planning
description:
  en: "Coordinate-based route optimization across Stanton, Pyro, and Nyx (4.8 universe data). Straight-line quantum-travel distances are computed at runtime from real location coordinates, so multi-stop routes, cross-system legs through jump-point gateways, and point-to-point lookups all use live geometry rather than a precomputed table."
